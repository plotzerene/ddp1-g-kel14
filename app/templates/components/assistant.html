{# Floating AI Virtual Assistant (TikBuddy): markup saja; perilaku di static/js/assistant.js, gaya di static/css/assistant.css. #}
<div class="ai-widget" id="ai-widget" data-endpoint="{{ url_for('assistant.chat') }}">
  <section class="ai-panel liquid-glass" id="ai-panel" role="dialog" aria-label="TikBuddy" hidden>
    <header class="ai-panel__head">
      <span class="ai-avatar" aria-hidden="true">
        <img class="ai-avatar__logo" src="{{ url_for('static', filename='images/gemini-logo.png') }}" alt="" width="22" height="22">
      </span>
      <div class="ai-panel__title">
        <strong>TikBuddy</strong>
        <span class="ai-status"><i aria-hidden="true"></i>Online · Virtual Assistant</span>
      </div>
      <button type="button" class="ai-iconbtn" id="ai-close" aria-label="Tutup asisten">&#10005;</button>
    </header>
    <div class="ai-chips" id="ai-chips">
      <button type="button" class="ai-chip" data-q="Gue lagi pengin nonton film seru, rekomendasiin dong!">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 3v18M17 3v18M3 8h4M3 12h18M3 16h4M17 8h4M17 16h4"/></svg>
        <span>Rekomendasi Film Seru</span>
      </button>
      <button type="button" class="ai-chip" data-q="Gimana cara klaim diskon UI 15%?">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
        <span>Cara Klaim Diskon UI 15%</span>
      </button>
      <button type="button" class="ai-chip" data-q="Gimana cara ambil makanan dan minuman yang gue pesan?">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8h12l-1.2 12a1 1 0 0 1-1 .9H8.2a1 1 0 0 1-1-.9z"/><path d="M5 8h14M13 8l1.5-5H17"/></svg>
        <span>Info Ambil Makanan &amp; Minuman</span>
      </button>
      <button type="button" class="ai-chip" data-q="Merchandise resmi apa aja yang ada dan gimana pengirimannya?">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.4 7.4 16 4h-2a2 2 0 0 1-4 0H8L3.6 7.4a1 1 0 0 0-.2 1.4L5 11h2v9h10v-9h2l1.6-2.2a1 1 0 0 0-.2-1.4z"/></svg>
        <span>Merchandise Resmi</span>
      </button>
    </div>
    <div class="ai-body" id="ai-body" role="log" aria-live="polite">
      <div class="ai-msg ai-msg--bot">Halo! Aku TikBuddy, asisten virtual titiket.com. Ada yang bisa kubantu seputar rekomendasi tontonan atau info tiket hari ini?</div>
    </div>
    <form class="ai-input" id="ai-form" autocomplete="off">
      <input type="text" id="ai-text" maxlength="600" placeholder="Tanya TikBuddy tentang film, konser, atau tiket..." aria-label="Pesan untuk asisten">
      <button type="submit" class="ai-send" aria-label="Kirim"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
    </form>
  </section>
  <button type="button" class="ai-fab" id="ai-fab" aria-label="Tanya TikBuddy" title="Tanya TikBuddy" aria-expanded="false" aria-controls="ai-panel">
    <img class="ai-fab__logo" src="{{ url_for('static', filename='images/gemini-logo.png') }}" alt="Tanya TikBuddy" width="28" height="28">
  </button>
</div>
